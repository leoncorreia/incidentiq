# Standalone repo: blueprint path = backend/render.yaml (or move this file to repo root).
# rootDir is relative to the repository root.
services:
  - type: web
    name: incidentiq-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ALLOWED_ORIGINS
        value: https://your-frontend.vercel.app,http://localhost:5173,http://localhost:3000
      - key: PIPESHIFT_API_KEY
        sync: false
      - key: PIPESHIFT_API_URL
        sync: false
      - key: PIPESHIFT_MODEL
        sync: false
      - key: HYDRADB_API_KEY
        sync: false
      - key: HYDRADB_TENANT_ID
        sync: false
      - key: HYDRADB_BASE_URL
        value: https://api.hydradb.com
